
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Transformation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6e6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        div {
            width: 250px;
            height: 150px;
            background-color: #8064d8;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            font-size: 20px;

            /* CSS Transition */
            transition: transform 0.6s ease;
        }

        /* 3D Transformation on Hover */
        div:hover {
            transform: perspective(500px)
                       rotateY(35deg)
                       scale(1.1);
        }
    </style>
</head>

<body>

    <div>
        Hover over me!
    </div>

</body>
</html>
